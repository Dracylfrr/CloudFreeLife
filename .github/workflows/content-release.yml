name: Content release

# Push a tag such as castle_dreams_v1.0.0 to publish a downloadable content pack.
#   - A free pack: its source is committed under content-packs/<id>/ (same layout as content/), with
#     content-packs/<id>/pack.json holding the pack's name, description, kind and minAppVersion.
#   - A premium pack: its ENCRYPTED files (made on the author's computer with scripts/dlc.mjs) are committed under
#     premium-releases/<tag>/ and are published as they are. The stories themselves are never in this repository.
on:
  push:
    tags: ['*_v[0-9]*.[0-9]*.[0-9]*', '!kokoro_voices_v*']

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is there a free pack to build for this tag?
        id: chk
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ID="${TAG%_v*}"
          if [ -f "content-packs/$ID/pack.json" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "premium=false" >> "$GITHUB_OUTPUT"
          elif ls "premium-releases/$TAG/"*.dreampack >/dev/null 2>&1 && [ -f "premium-releases/$TAG/cloud-freelife-release.json" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "premium=true" >> "$GITHUB_OUTPUT"
            echo "Publishing the encrypted premium pack for $TAG."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "premium=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish for $TAG in this repository."
          fi
      - name: Build the pack
        if: steps.chk.outputs.build == 'true'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ID="${TAG%_v*}"
          VERSION="${TAG##*_v}"
          NAME=$(node -e "const m=require('./content-packs/$ID/pack.json');console.log(m.name)")
          DESC=$(node -e "const m=require('./content-packs/$ID/pack.json');console.log(m.description||'')")
          MIN=$(node -e "const m=require('./content-packs/$ID/pack.json');console.log(m.minAppVersion||'1.0.0')")
          KIND=$(node -e "const m=require('./content-packs/$ID/pack.json');console.log(m.kind||'book')")
          node scripts/pack-content.mjs "content-packs/$ID/content" --id "$ID" --version "$VERSION" --name "$NAME" --description "$DESC" --min-app "$MIN" --kind "$KIND" --out release
      - uses: softprops/action-gh-release@v2
        if: steps.chk.outputs.build == 'true'
        with:
          files: release/*
      - uses: softprops/action-gh-release@v2
        if: steps.chk.outputs.premium == 'true'
        with:
          name: ${{ github.ref_name }}
          body: Premium content. It is encrypted and needs a license to open.
          files: premium-releases/${{ github.ref_name }}/*

name: Release

# Push a tag such as v1.0.0 to build the Windows installer and attach it, the
# portable zip, the checksums and the release manifest to a GitHub Release.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - run: node scripts/package-windows.mjs
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

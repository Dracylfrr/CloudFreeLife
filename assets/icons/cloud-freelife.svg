    <path d="M335 326 C 333 364, 350 388, 356 404 C 362 388, 379 364, 377 326 Z" fill="#ffa6c9"/>
    <path d="M345 330 C 344 354, 352 372, 356 384 C 356 366, 354 346, 352 330 Z" fill="#ffd0e2" opacity="0.8"/>

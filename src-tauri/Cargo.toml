[package]
name = "cloud-freelife"
version = "2.3.0"
description = "Project D.R.E.A.M: Cloud Sonata - a calm pastel coloring, drawing and mini-game app"
authors = ["Project D.R.E.A.M contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "cloud_freelife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
sha2 = "0.10"
ed25519-dalek = "2"
aes-gcm = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Small, fast, quiet release binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
